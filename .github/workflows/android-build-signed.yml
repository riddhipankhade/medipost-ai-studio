name: Android Signed Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor Android
        run: npm install @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android

      - name: Set build number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/medipost.keystore \
            -alias medipost \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Medipost AI, OU=Mobile, O=SID Clinic Pvt Ltd, L=Ahmedabad, S=Gujarat, C=IN" \
            -storepass medipost123 \
            -keypass medipost123

      - name: Build signed APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/medipost.keystore \
            -Pandroid.injected.signing.store.password=medipost123 \
            -Pandroid.injected.signing.key.alias=medipost \
            -Pandroid.injected.signing.key.password=medipost123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medipost-android-signed
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: medipost-keystore
          path: android/app/medipost.keystore
          retention-days: 7